server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types application/wasm text/javascript application/javascript text/html text/css application/json application/manifest+json image/svg+xml text/plain;

    # These sites keep the same file names between versions (no hash in the name),
    # so the browser must revalidate every time. The ETag keeps this cheap.
    add_header Cache-Control "no-cache";

    # A missing file must be a real 404 error.
    location / { try_files $uri $uri/ =404; }
}
