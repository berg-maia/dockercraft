name: Build craft web images

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      project:
        description: 'Só este projeto (ex: pdfcraft). Vazio = todos'
        required: false
      version:
        description: 'Versão específica (exige o campo project). Vazio = última release'
        required: false

permissions:
  contents: read
  packages: write

jobs:
  list:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
      - id: m
        env:
          ONLY: ${{ inputs.project }}
          VER: ${{ inputs.version }}
        run: |
          if [ -n "$VER" ] && [ -z "$ONLY" ]; then
            echo "::error::O campo version só pode ser usado junto com project."
            exit 1
          fi
          if [ -n "$ONLY" ]; then
            M=$(jq -c --arg n "$ONLY" '{include: map(select(.name==$n))}' projects.json)
          else
            M=$(jq -c '{include: .}' projects.json)
          fi
          echo "matrix=$M" >> "$GITHUB_OUTPUT"

  build:
    needs: list
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.list.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5

      - name: Descobrir versão e zip da release
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
          REPO: ${{ matrix.repo }}
          NAME: ${{ matrix.name }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            V="${INPUT_VERSION#v}"
            JSON=$(gh api "repos/$REPO/releases/tags/v$V" 2>/dev/null || gh api "repos/$REPO/releases/tags/$V")
          else
            JSON=$(gh api "repos/$REPO/releases/latest")
          fi
          TAG=$(jq -r .tag_name <<<"$JSON")
          VERSION="${TAG#v}"
          URL=$(jq -r '[.assets[] | select(.name | test("-web-.*\\.zip$"))][0].browser_download_url // empty' <<<"$JSON")
          if [ -z "$URL" ]; then
            echo "::error::Nenhum zip web encontrado na release $TAG de $REPO"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${NAME}-web" >> "$GITHUB_OUTPUT"
          echo "$NAME: versão $VERSION, zip $URL"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Essa versão já foi publicada?
        id: check
        run: |
          if docker manifest inspect "${{ steps.v.outputs.image }}:${{ steps.v.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3
        if: steps.check.outputs.exists == 'false'

      - uses: docker/build-push-action@v6
        if: steps.check.outputs.exists == 'false'
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: ZIP_URL=${{ steps.v.outputs.url }}
          tags: |
            ${{ steps.v.outputs.image }}:${{ steps.v.outputs.version }}
            ${{ steps.v.outputs.image }}:latest
