server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types application/wasm text/javascript text/html;

    # Names that do not change between versions: always revalidate
    # Nomes que não mudam entre versões: sempre revalidar
    location = /index.html            { add_header Cache-Control "no-cache"; }
    location = /app/parts.txt         { add_header Cache-Control "no-cache"; }
    location = /fonts/manifest.txt    { add_header Cache-Control "no-cache"; }
    location = /app/photocraft-web.js { add_header Cache-Control "no-cache"; }

    # Files with a hash in the name: can be cached permanently
    # Arquivos com hash no nome: podem ficar em cache permanentemente
    location ~* \.(wasm|js)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Fonts: correct MIME type and revalidation, since the filename does not change when the file is replaced
    # Fontes: tipo correto e revalidação, pois o nome não muda quando o arquivo é substituído
    location ~* \.(ttf|otf)$ {
        types {
            font/ttf ttf;
            font/otf otf;
        }
        add_header Cache-Control "no-cache";
    }

    # Missing files must return a genuine 404 error
    # Arquivos ausentes devem retornar um erro 404 real
    location / {
        try_files $uri $uri/ =404;
    }
}
